# Eio's interface constructors are extension constructors: the test names
# each binding through Obj.Extension_constructor, which reads and casts
# nothing. Its outcomes record whatever an operation raises, cancellation
# included, to compare the wrapper with the bare filesystem.
[[rules]]
files = ["test/law/test_chaos_law.ml"]
exclude = ["E100", "E105"]

# The interpreter writes whatever an operation raises, but a cancellation, as
# its outcome, to compare a directory with the kernel. Its scenarios are one
# list of names and operation lines, which merlint measures as a function.
[[rules]]
files = ["lib/kernel/eio_fs_kernel.ml"]
exclude = ["E005", "E105"]

# The traces pin the recorder's digest: renaming its entry point means
# recording them again on Linux and on macOS.
[[rules]]
files = ["test/os/scripts/record.ml"]
exclude = ["E330"]

# The test compiles a copy of eio_fs's private Quiet_mock: it links no eio_fs.
[[rules]]
files = ["test/quiet_mock/*"]
exclude = ["E606"]

# A setup's I_dir, I_file and I_link stand beside a node's Dir, File and Link
# in the same module: bare, the later type would take the names.
[[rules]]
files = ["test/envelope/envelope.ml"]
exclude = ["E334"]

# The litmus tests check Chaos.Crash through the Litmus runner against
# Ferrite's models, ported here: they test the crash model as a whole rather
# than one library module.
[[rules]]
files = ["test/litmus/*"]
exclude = ["E610"]

# The test compiles a copy of eio_fs's private Extents: it links no eio_fs.
[[rules]]
files = ["test/extents/*"]
exclude = ["E606"]

# The law's table: one entry per operation, made where a module of Eio's
# interface signature defines it, so an operation Eio adds fails to compile.
[[rules]]
files = ["lib/chaos/chaos_law.ml"]
exclude = ["E005"]

# A copy of Eio_mock's scheduler, kept as close to it as the changes allow,
# as eio-net's copy is.
[[rules]]
files = ["lib/chaos/quiet_mock.ml"]
exclude = ["E005"]

# Eio_fs_unix includes this module: its names are the library's own, such as
# Eio_fs_unix.lock_range and Eio_fs_unix.lock_section.
[[rules]]
files = ["lib/unix/lock.ml", "lib/unix/lock.mli"]
exclude = ["E330"]

# Crash is one controller: its journal, the cut and the handles it wraps read
# and write the same mutable state, and no seam left in it brings a part under
# the bound without exporting that state. Chaos_blocks and Chaos_journal hold
# the parts that stand alone.
[[rules]]
files = ["lib/chaos/chaos_model.ml"]
exclude = ["E015"]

# The in-memory core is a private library of eio-fs: these tests reach it
# through Eio_fs.Fs, its public face.
[[rules]]
files = ["test/test_low_level.ml", "test/test_memfs.ml"]
exclude = ["E606"]

# The fuzzer compiles a copy of the private Extents: it links no eio_fs_mem.
[[rules]]
files = ["fuzz/fuzz_extents.ml"]
exclude = ["E710"]
